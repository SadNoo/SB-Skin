name: SkywaveDemo
options:
  bundleIdPrefix: io.github.sadnoo.skywave
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Skywave:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Demo only: ad-hoc “Sign to Run Locally”. Set your team to run on a device.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
targets:
  SkywaveDemo:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App]
    dependencies:
      - package: Skywave
        product: Skywave
      - target: SkywaveDemoWidgets
        destinationFilters: [iOS]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Skywave Demo
        CFBundleLocalizations: [en, zh-Hans, zh-Hant]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: io.github.sadnoo.skywave.demo
            CFBundleURLSchemes: [skywavedemo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sadnoo.skywave.demo
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
  SkywaveDemoWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets]
    dependencies:
      - package: Skywave
        product: SkywaveWidgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Skywave Demo Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sadnoo.skywave.demo.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
